# Dim, then turn the screen off. No suspend, so agents keep running.
# Video players (Firefox, mpv) and fullscreen windows inhibit idle.
general {
    ignore_dbus_inhibit = false
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 180                                            # 3 min: dim to half
    on-timeout = brightnessctl -s set $(( $(brightnessctl get) / 2 ))
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                            # 5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
